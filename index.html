<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://tcxflzcmxsfefxorcdov.supabase.co wss://tcxflzcmxsfefxorcdov.supabase.co; media-src https://tcxflzcmxsfefxorcdov.supabase.co blob:; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>לוח שיחות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Suez+One&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script src="config.js?v=2026-10-27k"></script>
<style>
/* Layout: a two-pane call sheet. The call queue sits on the start side, the open lead's call card beside it; the live call panel sits at the top of the card. One column on phones. */
:root{
  --paper:#eceff2; --panel:#ffffff; --sunk:#f5f7f9; --ink:#16202b; --muted:#5a6672; --line:#d6dce2;
  --tape:#f2b705; --tape-ink:#1b1606; --call:#17744a; --call-ink:#ffffff; --rec:#c2410c;
  --ok-bg:#e2f3ea; --ok-ink:#14532d; --warn-bg:#fcefdc; --warn-ink:#7a3e06; --info-bg:#e6edfb; --info-ink:#1e3a8a;
  --plan-bg:#efe8fb; --plan-ink:#4c1d95; --bad-bg:#fbe7e5; --bad-ink:#7f1d1d; --focus:#2563eb;
  --f-display:"Suez One","IBM Plex Sans Hebrew","Arial Hebrew",serif;
  --f-body:"IBM Plex Sans Hebrew","Arial Hebrew",-apple-system,"Segoe UI",Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0f141a; --panel:#18202a; --sunk:#141b23; --ink:#e7edf3; --muted:#98a5b2; --line:#2a3542;
    --tape:#f5c331; --call:#239d64; --rec:#f97316;
    --ok-bg:#16352a; --ok-ink:#a7e3c4; --warn-bg:#3a2a12; --warn-ink:#f7cf96; --info-bg:#1a2848; --info-ink:#b7c8f5;
    --plan-bg:#2a2045; --plan-ink:#d6c6f7; --bad-bg:#3d1c1a; --bad-ink:#f5b8b1; --focus:#7aa2ff;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body)}
a{color:var(--info-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) 24px;max-width:1440px;margin:0 auto}
.hidden{display:none!important}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.primary{background:var(--call);color:var(--call-ink);border-color:transparent;font-weight:600}
.btn.rec{background:var(--rec);color:#fff;border-color:transparent;font-weight:600}
.note{font-size:13px;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=datetime-local],input[type=search],textarea,select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--panel);max-width:100%}
textarea{width:100%;min-height:72px;resize:vertical}
.tape{height:6px;border-radius:3px;background:
  repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 10px) 0 0/100% 3px no-repeat,
  repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 50px) 0 0/100% 6px no-repeat,
  var(--tape);opacity:.9}
h1{font:400 22px/1.2 var(--f-display);margin:0;letter-spacing:.2px}
h2{font:400 22px/1.25 var(--f-display);margin:0;text-wrap:balance}
/* auth */
.auth{max-width:380px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:12px}
.auth label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.auth label input{color:var(--ink);font-size:15px}
.msg{font-size:13.5px;padding:7px 10px;border-radius:8px;background:var(--warn-bg);color:var(--warn-ink)}
.msg.ok{background:var(--ok-bg);color:var(--ok-ink)}
/* header */
header.top{padding-block:12px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.titlerow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--panel)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:var(--call)} .sync.saving .dot{background:var(--tape)} .sync.err .dot{background:var(--rec)}
.who{font-size:12.5px;color:var(--muted)}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-inline-start:auto}
.stat{display:flex;flex-direction:column;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 10px;min-width:72px}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.2px}
.stat b{font:600 15px/1.2 var(--f-num);font-variant-numeric:tabular-nums}
.stat b.alert{color:var(--rec)}
.rule{font-size:13px;padding:7px 12px;border-radius:8px;background:var(--info-bg);color:var(--info-ink)}
.rule.go{background:var(--ok-bg);color:var(--ok-ink)} .rule.pivot{background:var(--warn-bg);color:var(--warn-ink)} .rule.side{background:var(--bad-bg);color:var(--bad-ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input[type=search]{flex:1 1 220px;min-width:0}
/* layout */
.layout{display:grid;grid-template-columns:minmax(300px,410px) minmax(0,1fr);gap:14px;padding-top:14px;align-items:start}
#list{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 24px);overflow:auto;padding:2px;position:sticky;top:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;cursor:pointer;text-align:start;width:100%}
.row:hover{border-color:var(--muted)}
.row.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.sub{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.sc{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font:600 14px var(--f-num);border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
.sc.s5{background:var(--tape);color:var(--tape-ink);border-color:transparent}
.sc.s4{box-shadow:inset 0 -3px 0 var(--tape)}
.sc.fb{font-size:11px;font-family:var(--f-body);color:var(--info-ink);background:var(--info-bg);border-color:transparent}
.pill{font-size:12px;border-radius:999px;padding:1px 9px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.st-noanswer,.st-voicemail{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.st-callback{background:var(--info-bg);color:var(--info-ink);border-color:transparent}
.st-booked,.st-demo{background:var(--plan-bg);color:var(--plan-ink);border-color:transparent}
.st-done,.st-won{background:var(--ok-bg);color:var(--ok-ink);border-color:transparent}
.st-notrelevant{text-decoration:line-through}
.st-dnc{background:var(--bad-bg);color:var(--bad-ink);border-color:transparent}
.due{color:var(--rec);font-weight:600}
#detail{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-height:calc(100vh - 24px);overflow:auto;position:sticky;top:8px}
.empty{color:var(--muted);text-align:center;padding:56px 12px}
.empty b{display:block;color:var(--ink);font:400 18px var(--f-display);margin-bottom:6px}
.head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.head .whois{flex:1 1 260px;min-width:0}
.meta{color:var(--muted);font-size:13px}
.dial{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.dialrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.call{display:inline-flex;align-items:center;gap:8px;background:var(--call);color:var(--call-ink);text-decoration:none;border-radius:10px;padding:9px 16px;font:600 18px var(--f-num);direction:ltr;font-variant-numeric:tabular-nums}
.call.alt{background:transparent;color:var(--call);border:1.5px solid var(--call);font-size:15px;padding:6px 12px}
.links{display:flex;gap:12px;flex-wrap:wrap;font-size:13.5px;margin-top:8px}
/* live call */
.callbar{margin-top:12px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;display:grid;gap:8px}
.callbar.on{border-style:solid;border-color:var(--rec)}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.calltime{font:600 16px var(--f-num);font-variant-numeric:tabular-nums}
.mic{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.mic.on .dot{background:var(--rec);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.mic.on .dot{animation:none}}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stagechip{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--sunk);cursor:pointer}
.stagechip.done{background:var(--ok-bg);color:var(--ok-ink);border-color:transparent}
.stagechip.miss{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent;font-weight:600}
.objlive{border:2px solid var(--tape);border-radius:12px;padding:10px 12px}
.objlive .t{display:flex;justify-content:space-between;gap:8px;align-items:center;font:400 19px/1.3 var(--f-display)}
.objlive .heard{font-size:12.5px;color:var(--muted)}
.transcript{max-height:180px;overflow:auto;font-size:14px;display:flex;flex-direction:column;gap:3px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.transcript .ts{font:500 11px var(--f-num);color:var(--muted);margin-inline-end:6px}
.transcript .interim{color:var(--muted);font-style:italic}
.dialrow .lbl{font-size:12px;color:var(--muted)}
.call.off{background:transparent;color:var(--muted);border:1.5px dashed var(--line);cursor:not-allowed;text-decoration:line-through}
.flag{color:var(--warn-ink);font-weight:600}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:0 8px;background:var(--tape);color:var(--tape-ink);white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.brief.hot{border-color:var(--tape);border-width:2px}
.wa{font-size:13.5px;overflow-wrap:anywhere;flex:1 1 240px}
.sv{font-size:11.5px;font-weight:600;margin-inline-start:6px;white-space:nowrap}
.sv.saving{color:var(--muted)} .sv.saved{color:var(--call)} .sv.error{color:var(--rec)}
.calc{display:grid;gap:8px;margin:8px 0}
.logrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.lognum{width:26px;height:26px;border-radius:50%;background:var(--tape);color:var(--tape-ink);display:grid;place-items:center;font:600 14px var(--f-num)}
.loglist{display:grid;gap:6px;margin-top:8px}
.recbadge{font-size:13px;font-weight:600;color:var(--muted)} .recbadge.on{color:var(--rec)}
.recrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.recrow audio{width:100%;max-width:420px}
.recrow .trd{flex-basis:100%}
.sugsw{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:14px;cursor:pointer}
.suggest{border:2px solid var(--call);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.suggest .sg-h{font-size:12.5px;font-weight:600;color:var(--muted)}
.suggest .sg{font:400 19px/1.35 var(--f-display)}
.suggest .sg.old{font:14px/1.45 var(--f-body);color:var(--muted)}
.sgtag{display:inline-block;font:600 11.5px/1.6 var(--f-body);background:var(--ok-bg);color:var(--ok-ink);border-radius:999px;padding:0 8px;margin-inline-end:8px;vertical-align:middle}
.trbody .k{color:var(--muted);font-size:12.5px}
.calcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.calcgrid .f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.calcgrid input,.calcgrid select{font-size:15px;color:var(--ink)}
.calcout{display:grid;gap:4px;padding:10px 12px;border-radius:8px;background:var(--sunk);border:1px solid var(--line);font-size:14px}
.calcout .loss b{font:400 19px/1.3 var(--f-display);color:var(--rec)}
.calcout .say{padding:6px 10px;border-inline-start:3px solid var(--tape);background:var(--panel);border-radius:4px}
.flag.dim{color:var(--muted)}
.phonenotes{display:grid;gap:6px;margin-top:10px}
.trlog{display:grid;gap:6px}
.trd{border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.trd summary{cursor:pointer;padding:5px 10px;font-size:13.5px}
.trd .trbody{padding:4px 10px 10px;display:grid;gap:3px;font-size:14px;max-height:320px;overflow:auto}
.trline .ts{font:500 11px var(--f-num);font-variant-numeric:tabular-nums;color:var(--muted);margin-inline-end:8px}
/* brief, facts, forms */
.brief{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.brief h3{margin:0;font-size:13px;letter-spacing:.4px;padding:8px 14px;background:var(--tape);color:var(--tape-ink);display:flex;justify-content:space-between;gap:8px}
.brief .in{padding:12px 14px;display:grid;gap:10px}
.opener{margin:0;padding:10px 12px;border-inline-start:3px solid var(--tape);background:var(--sunk);border-radius:6px}
.qs{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.bk .k{font-size:11.5px;color:var(--muted);letter-spacing:.3px;margin-bottom:1px}
.bk.obj{padding:8px 10px;border-radius:6px;background:var(--info-bg);color:var(--info-ink)}
.bk.obj .k{color:inherit;opacity:.8}
.watch{font-size:13.5px;padding:7px 10px;border-radius:6px;background:var(--warn-bg);color:var(--warn-ink)}
.objs{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.objs-h{width:100%;font-size:13px;font-weight:600}
.obj-d{border:1px solid var(--line);border-radius:999px;background:var(--sunk)}
.obj-d[open]{flex-basis:100%;border-radius:10px;background:var(--panel)}
.obj-d summary{cursor:pointer;padding:3px 12px;font-size:13.5px;list-style:none}
.obj-d summary::-webkit-details-marker{display:none}
.obj-d[open] summary{font-weight:600;border-bottom:1px solid var(--line)}
.obj-d .md{padding:6px 12px 10px}
.fit{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--ok-bg);color:var(--ok-ink)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;margin-top:12px}
.kv{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;overflow-wrap:anywhere}
.kv .k{font-size:11.5px;color:var(--muted);letter-spacing:.3px;margin-bottom:2px}
section.box{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:10px}
section.box h3{font-size:15px;margin:0}
.statuses{display:flex;gap:6px;flex-wrap:wrap}
.statuses .btn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.form .f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.form .f>input,.form .f>textarea{color:var(--ink);font-size:14.5px}
.radios{display:flex;gap:6px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:5px;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:14px}
.radios input{accent-color:var(--call)}
.price{font-size:13.5px;padding:8px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn-ink)}
.hist{margin:0;padding-inline-start:18px;font-size:12.5px;color:var(--muted)}
details.script{margin-top:18px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--sunk)}
details.script summary{cursor:pointer;font-weight:600}
.md{max-width:70ch}
.md h2{font:600 15px var(--f-body);margin:16px 0 4px}.md h3{font-size:14px;margin:12px 0 4px}
.md blockquote{margin:6px 0;padding:6px 10px;border-inline-start:3px solid var(--tape);background:var(--panel);border-radius:4px}
.md li{margin:2px 0}.md p{margin:4px 0}
.back{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  #list{max-height:none;position:static}
  #detail{display:none;max-height:none;position:static}
  .app.showdetail #list,.app.showdetail .listtools{display:none}
  .app.showdetail #detail{display:block}
  .back{display:inline-flex}
  .stats{margin-inline-start:0}
}
</style>
</head>
<body>
<div class="app" id="app">

  <section class="auth hidden" id="authView" aria-labelledby="authTitle">
    <div class="tape" aria-hidden="true"></div>
    <h1 id="authTitle">לוח שיחות</h1>
    <form id="loginForm" class="auth-form" style="display:grid;gap:10px">
      <label for="loginEmail">מייל<input type="email" id="loginEmail" autocomplete="username" required dir="ltr"></label>
      <label for="loginPass">סיסמה<input type="password" id="loginPass" autocomplete="current-password" required dir="ltr"></label>
      <button type="submit" class="btn primary">כניסה</button>
      <button type="button" class="btn sm" id="forgotBtn">שכחתי סיסמה</button>
    </form>
    <form id="setPassForm" class="hidden" style="display:grid;gap:10px">
      <div class="note">בחר סיסמה לחשבון שלך (לפחות 10 תווים).</div>
      <label for="newPass">סיסמה חדשה<input type="password" id="newPass" autocomplete="new-password" minlength="10" required dir="ltr"></label>
      <button type="submit" class="btn primary">שמור סיסמה והיכנס</button>
    </form>
    <div class="msg hidden" id="authMsg" role="status"></div>
  </section>

  <section class="hidden" id="noAccess">
    <div class="auth"><h1>אין עדיין הרשאה</h1><div class="note">החשבון שלך מחובר, אבל עוד לא נוסף לצוות. בקש מפול להוסיף אותך.</div><button type="button" class="btn" id="logout2">יציאה</button></div>
  </section>

  <section class="hidden" id="mainView">
    <header class="top">
      <div class="tape" aria-hidden="true"></div>
      <div class="titlerow">
        <h1>לוח שיחות</h1>
        <span class="sync" id="sync"><span class="dot"></span><span id="syncText">מתחבר…</span></span>
        <span class="who" id="whoami"></span>
        <button type="button" class="btn sm" id="logout">יציאה</button>
        <div class="stats" id="stats"></div>
      </div>
      <div class="rule" id="rule"></div>
      <div class="tools listtools">
        <input type="search" id="q" placeholder="חיפוש: שם, עיר, טלפון, תחום" aria-label="חיפוש">
        <select id="fSrc" aria-label="מקור"><option value="">כל המקורות</option><option value="g">גוגל מפס</option><option value="f">פייסבוק</option></select>
        <select id="fNiche" aria-label="תחום"><option value="">כל התחומים</option></select>
        <select id="fScore" aria-label="ציון"><option value="0">כל הציונים</option><option value="5">ציון 5</option><option value="4">4 ומעלה</option><option value="3">3 ומעלה</option></select>
        <select id="fStatus" aria-label="סטטוס"><option value="">כל הסטטוסים</option></select>
        <select id="sort" aria-label="מיון"><option value="next">הבא בתור</option><option value="score">לפי ציון</option><option value="recent">עודכנו לאחרונה</option></select>
        <button class="btn sm" id="logsSummary" type="button">סיכום רישומים</button>
        <button class="btn sm" id="exportCsv" type="button">ייצוא יומן (CSV)</button>
        <label class="btn sm hidden" for="importFile" id="importLabel">ייבוא נתונים (מנהל)</label>
        <input type="file" id="importFile" accept=".json,application/json" class="hidden">
      </div>
    </header>
    <div class="layout">
      <div id="list" role="list"></div>
      <div id="detail"><div class="empty"><b>בחר עסק מהרשימה</b>יופיעו כאן התדריך, הטלפון, הקשבה לשיחה, הסטטוס וטופס הסיכום. כל סימון נשמר מיד ומופיע אצל כל הצוות.</div></div>
    </div>
  </section>
</div>

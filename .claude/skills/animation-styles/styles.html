<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>20 Animation Styles</title>
<style>
  :root{--bg:#160c09;--fg:#f6ebe1;--muted:#c9a995;--accent:#ffc83d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI","DejaVu Sans",sans-serif}
  header{padding:20px 16px 4px;text-align:center}
  header h1{margin:0;font-size:22px}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  header a{color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;padding:16px;max-width:1400px;margin:0 auto}
  figure{margin:0}
  figure a{display:block;text-decoration:none;color:inherit}
  .grid canvas{width:100%;aspect-ratio:9/16;display:block;border-radius:14px;background:#000}
  figcaption{text-align:center;margin-top:6px;font-size:14px}
  figcaption small{display:block;color:var(--muted);font-size:12px}
  body.single{display:grid;place-items:center;min-height:100vh}
  body.single canvas{height:100vh;width:auto;max-width:100vw;aspect-ratio:9/16;display:block}
  body.render{margin:0;overflow:hidden}
  body.render canvas{display:block}
</style>
</head>
<body>
<script>
/* =====================================================================
   20 animation styles, one shared motion.
   - scene(t) holds the motion: where the rocket, smoke, clouds, stars are at time t.
   - Each style is a "skin": STYLE.draw(ctx, scene) paints that motion in its look.
   - Everything is a pure function of t (no Math.random, no frame deltas), so any
     frame can be rendered on demand and the loop is seamless (LOOP seconds).
   URL: styles.html            gallery of all 20
        styles.html?style=7    one style, full screen (number 1-20 or id, e.g. ?style=neon)
        styles.html?reel=1     the 20-style showcase reel (24 s)
        &render=1&w=1080       for render.cjs: fixed canvas size, no animation loop,
                               window.renderAt(t) draws one frame
   ===================================================================== */
const W = 540, H = 960, LOOP = 6, TAU = Math.PI * 2;
const rnd = (i, k = 0) => { const x = Math.sin(i * 127.1 + k * 311.7 + 1.3) * 43758.5453; return x - Math.floor(x); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- shared motion ---------- */
function scene(t) {
  t = ((t % LOOP) + LOOP) % LOOP;
  const w = TAU / LOOP, s = { t, w, fi: Math.floor(t * 12) };
  s.rx = W / 2 + Math.sin(w * t * 2) * 7;
  s.ry = H * 0.44 + Math.sin(w * t * 3) * 10;
  s.tilt = Math.sin(w * t * 2 + 0.6) * 0.035;
  s.flame = 1 + 0.16 * Math.sin(w * t * 72) + 0.09 * Math.sin(w * t * 43 + 1);
  const N = 24, P = 2, cyc = LOOP / P;
  s.puffs = [];
  for (let k = 0; k < N; k++) {
    const u = t / P + k / N, ph = u % 1, sd = k + (Math.floor(u) % cyc) * N;
    s.puffs.push({
      ph, sd,
      x: s.rx + (rnd(sd, 1) - 0.5) * 190 * ph + (rnd(sd, 2) - 0.5) * 16,
      y: s.ry + 112 + ph * (H - s.ry - 40) * (0.75 + 0.35 * rnd(sd, 3)),
      r: 9 + (38 + 22 * rnd(sd, 4)) * Math.sqrt(ph),
      a: ph < 0.06 ? ph / 0.06 : 1 - Math.pow((ph - 0.06) / 0.94, 2.5),
    });
  }
  s.puffs.sort((a, b) => b.ph - a.ph);
  const span = H + 300;
  s.clouds = [];
  for (let i = 0; i < 6; i++) {
    const y = ((rnd(i, 5) * span + t * span / LOOP) % span) - 150;
    const x = (i % 2 ? 0.8 : 0.2) * W + (rnd(i, 6) - 0.5) * W * 0.22;
    s.clouds.push({ x, y, sc: 0.6 + rnd(i, 7) * 0.5, i });
  }
  s.stars = [];
  for (let i = 0; i < 55; i++) s.stars.push({ i, x: rnd(i, 8) * W, y: (rnd(i, 9) * H + t * H / LOOP) % H, r: 0.6 + rnd(i, 10) * 1.6, tw: 0.5 + 0.5 * Math.sin(w * t * (2 + i % 4) + i) });
  const ls = H + 400;
  s.lines = [];
  for (let i = 0; i < 14; i++) s.lines.push({ x: rnd(i, 11) * W, y: ((rnd(i, 12) * ls + t * 2 * ls / LOOP) % ls) - 200, len: 70 + rnd(i, 13) * 170 });
  return s;
}

/* ---------- shared drawing helpers ---------- */
function rocketGeo(fl = 1) {
  const L = 70 * fl, g = { L };
  g.body = new Path2D('M0,-95 C26,-66 31,-30 30,40 L-30,40 C-31,-30 -26,-66 0,-95 Z');
  g.finL = new Path2D('M-29,2 C-46,14 -58,36 -56,64 L-29,40 Z');
  g.finR = new Path2D('M29,2 C46,14 58,36 56,64 L29,40 Z');
  g.nozzle = new Path2D('M-15,40 L15,40 L19,55 L-19,55 Z');
  g.flame = new Path2D(`M-15,55 Q-22,${55 + L * 0.45} 0,${55 + L} Q22,${55 + L * 0.45} 15,55 Z`);
  g.flameIn = new Path2D(`M-8,55 Q-11,${55 + L * 0.3} 0,${55 + L * 0.62} Q11,${55 + L * 0.3} 8,55 Z`);
  g.noseLine = new Path2D('M-23,-53 Q0,-47 23,-53');
  g.bandLine = new Path2D('M-30,20 L30,20 M-30,30 L30,30');
  g.win1 = new Path2D(); g.win1.arc(0, -20, 16, 0, TAU);
  g.win2 = new Path2D(); g.win2.arc(0, -20, 11, 0, TAU);
  g.all = [g.finL, g.finR, g.nozzle, g.body, g.noseLine, g.win1, g.win2];
  return g;
}
function atRocket(ctx, s, sc, fn) { ctx.save(); ctx.translate(s.rx, s.ry); ctx.rotate(s.tilt); ctx.scale(sc, sc); fn(rocketGeo(s.flame)); ctx.restore(); }
function paintRocket(ctx, s, c, sc = 1) {
  atRocket(ctx, s, sc, g => {
    if (c.flame) { ctx.fillStyle = c.flame; ctx.fill(g.flame); ctx.fillStyle = c.flameIn; ctx.fill(g.flameIn); }
    ctx.fillStyle = c.fin; ctx.fill(g.finL); ctx.fill(g.finR);
    ctx.fillStyle = c.nozzle; ctx.fill(g.nozzle);
    ctx.fillStyle = c.body; ctx.fill(g.body);
    ctx.save(); ctx.clip(g.body);
    if (c.shade) { ctx.fillStyle = c.shade; ctx.fillRect(9, -100, 40, 150); }
    ctx.fillStyle = c.nose; ctx.fillRect(-40, -100, 80, 47);
    if (c.band) { ctx.fillStyle = c.band; ctx.fillRect(-40, 20, 80, 10); }
    ctx.restore();
    ctx.fillStyle = c.ring; ctx.fill(g.win1);
    ctx.fillStyle = c.win; ctx.fill(g.win2);
    if (c.glint) { ctx.fillStyle = c.glint; ctx.beginPath(); ctx.arc(-4, -24, 3.5, 0, TAU); ctx.fill(); }
    if (c.outline) {
      ctx.lineWidth = c.lw || 3; ctx.strokeStyle = c.outline; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      if (c.flame && c.flameOutline !== false) ctx.stroke(g.flame);
      g.all.forEach(p => ctx.stroke(p));
    }
  });
}
function cloudPath(x, y, sc, p = new Path2D()) {
  for (const [cx, cy, r] of [[-42, 4, 20], [-18, -12, 27], [12, -16, 30], [40, 0, 21], [0, 6, 24]]) {
    p.moveTo(x + (cx + r) * sc, y + cy * sc); p.arc(x + cx * sc, y + cy * sc, r * sc, 0, TAU);
  }
  p.roundRect(x - 60 * sc, y - 2 * sc, 120 * sc, 24 * sc, 12 * sc);
  return p;
}
function puffsPath(s, filter = () => true, rs = 1) {
  const p = new Path2D();
  for (const q of s.puffs) if (filter(q)) { p.moveTo(q.x + q.r * rs, q.y); p.arc(q.x, q.y, q.r * rs, 0, TAU); }
  return p;
}
/* outline of a union of shapes: thick stroke first, fill on top hides the inner half */
function union(ctx, path, fill, stroke, lw) {
  ctx.save(); ctx.lineJoin = 'round'; ctx.lineWidth = lw * 2; ctx.strokeStyle = stroke; ctx.stroke(path);
  ctx.fillStyle = fill; ctx.fill(path); ctx.restore();
}
function vgrad(ctx, stops, y0 = 0, y1 = H) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  stops.forEach(([o, c]) => g.addColorStop(o, c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function hatch(ctx, path, step, ang, color, lw) {
  ctx.save(); ctx.clip(path); ctx.rotate(ang); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath();
  for (let x = -400; x < 400; x += step) { ctx.moveTo(x, -400); ctx.lineTo(x, 400); }
  ctx.stroke(); ctx.restore();
}
function jitterStroke(ctx, path, n, amp, seed) {
  for (let j = 0; j < n; j++) {
    ctx.save(); ctx.translate((rnd(seed, j * 2) - 0.5) * amp, (rnd(seed, j * 2 + 1) - 0.5) * amp); ctx.stroke(path); ctx.restore();
  }
}
function scribble(ctx, x, y, r, seed, loops = 3) {
  ctx.beginPath();
  for (let a = 0; a <= TAU * loops; a += 0.25) {
    const rr = r * (0.55 + 0.45 * rnd(seed, Math.floor(a * 3))) ;
    const px = x + Math.cos(a) * rr + (a / (TAU * loops) - 0.5) * r * 0.6, py = y + Math.sin(a) * rr * 0.85;
    a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.stroke();
}
const offs = {};
function off(key, w, h) {
  let c = offs[key];
  if (!c || c.width !== w || c.height !== h) { c = offs[key] = document.createElement('canvas'); c.width = w; c.height = h; }
  return c;
}
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
/* draw a scene small, snap every pixel to a palette, scale up with hard edges */
function pixelate(ctx, ps, palette, drawFn, dither = 0, mapper = null) {
  const w = Math.round(W / ps), h = Math.round(H / ps), c = off('px' + ps, w, h);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.setTransform(1 / ps, 0, 0, 1 / ps, 0, 0); drawFn(x);
  const img = x.getImageData(0, 0, w, h), d = img.data, pal = palette.map(hex);
  for (let i = 0, p = 0; i < d.length; i += 4, p++) {
    const b = dither ? (BAYER[(p % w & 3) + ((Math.floor(p / w) & 3) << 2)] / 16 - 0.5) * dither : 0;
    let r = d[i] + b, g = d[i + 1] + b, bl = d[i + 2] + b, best = 0;
    if (mapper) best = mapper(r, g, bl);
    else {
      let bd = 1e9;
      for (let k = 0; k < pal.length; k++) {
        const dr = r - pal[k][0], dg = g - pal[k][1], db = bl - pal[k][2], dd = 2 * dr * dr + 4 * dg * dg + 3 * db * db;
        if (dd < bd) { bd = dd; best = k; }
      }
    }
    d[i] = pal[best][0]; d[i + 1] = pal[best][1]; d[i + 2] = pal[best][2]; d[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  ctx.save(); ctx.imageSmoothingEnabled = false; ctx.drawImage(c, 0, 0, W, H); ctx.restore();
}
function grain(key, color, n, alpha) {
  const c = off('grain' + key, W, H);
  if (!c.done) {
    const x = c.getContext('2d'); x.fillStyle = color;
    for (let i = 0; i < n; i++) { x.globalAlpha = alpha * rnd(i, 40); x.fillRect(rnd(i, 41) * W, rnd(i, 42) * H, 1 + rnd(i, 43) * 1.5, 1 + rnd(i, 44) * 1.5); }
    c.done = true;
  }
  return c;
}

/* ===================== the 20 skins ===================== */

/* 1. Pixel art: low-res render snapped to a 16-color palette, banded sunset sky */
const PICO = ['#1d2b53', '#3b2a6a', '#7e2553', '#c2416b', '#ff77a8', '#ff9e5e', '#ffd27a', '#fff1e8', '#c2c3c7', '#83769c', '#5f574f', '#ff004d', '#29adff', '#ffa300', '#ffec27', '#000000'];
function sPixel(ctx, s) {
  pixelate(ctx, 6, PICO, x => {
    vgrad(x, [[0, '#1d2b53'], [0.4, '#3b2a6a'], [0.68, '#c2416b'], [0.88, '#ff9e5e'], [1, '#ffd27a']]);
    x.fillStyle = '#fff1e8';
    for (const st of s.stars) if (st.y < H * 0.55 && st.tw > 0.4) x.fillRect(st.x, st.y, 6, 6);
    x.fillStyle = '#7e2553'; circle(x, W * 0.78, H * 0.13, 30); x.fill();
    x.strokeStyle = '#ff77a8'; x.lineWidth = 7; x.beginPath(); x.ellipse(W * 0.78, H * 0.13, 58, 13, -0.25, 0, TAU); x.stroke();
    for (const c of s.clouds) { x.fillStyle = '#c2c3c7'; x.fill(cloudPath(c.x, c.y + 8, c.sc)); x.fillStyle = '#fff1e8'; x.fill(cloudPath(c.x, c.y, c.sc)); }
    x.globalAlpha = 1;
    for (const q of s.puffs) { x.fillStyle = q.ph > 0.5 ? '#83769c' : '#c2c3c7'; circle(x, q.x + 5, q.y + 6, q.r); x.fill(); x.fillStyle = '#c2c3c7'; circle(x, q.x, q.y, q.r * 0.9); x.fill(); }
    paintRocket(x, s, { flame: '#ffa300', flameIn: '#ffec27', fin: '#ff004d', nozzle: '#5f574f', body: '#fff1e8', shade: '#c2c3c7', nose: '#ff004d', ring: '#5f574f', win: '#29adff' });
  });
}

/* 2. Neon: dark bg, stroke-only shapes with glow + white-hot core */
function neon(ctx, path, color, lw) {
  ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.shadowColor = color; ctx.shadowBlur = 22; ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.stroke(path);
  ctx.shadowBlur = 8; ctx.stroke(path);
  ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = lw * 0.35; ctx.stroke(path);
  ctx.restore();
}
function sNeon(ctx, s) {
  ctx.fillStyle = '#07031a'; ctx.fillRect(0, 0, W, H);
  const flick = 0.85 + 0.15 * Math.sin(s.w * s.t * 54) * Math.sin(s.w * s.t * 7);
  for (const c of s.clouds) {
    const p = new Path2D(); const sc = c.sc;
    p.moveTo(c.x - 55 * sc, c.y + 18 * sc); p.lineTo(c.x + 55 * sc, c.y + 18 * sc);
    p.arc(c.x + 40 * sc, c.y + 2 * sc, 16 * sc, Math.PI / 2, -Math.PI / 2, true);
    p.arc(c.x + 8 * sc, c.y - 10 * sc, 26 * sc, 0.2, -Math.PI, true);
    p.arc(c.x - 38 * sc, c.y + 2 * sc, 16 * sc, -Math.PI / 2, Math.PI / 2, true); p.closePath();
    neon(ctx, p, '#19e3ff', 4);
  }
  const pl = new Path2D(); pl.arc(W * 0.78, H * 0.62, 18, 0, TAU);
  const ring = new Path2D(); ring.ellipse(W * 0.78, H * 0.62, 36, 9, -0.3, 0, TAU);
  neon(ctx, pl, '#ffd400', 3); neon(ctx, ring, '#ff9d00', 3);
  for (const q of s.puffs) {
    const p = new Path2D(); p.arc(q.x, q.y, q.r * 0.7, 0, TAU);
    ctx.globalAlpha = q.a * 0.9; neon(ctx, p, q.sd % 3 ? '#a43dff' : '#ff3df2', 3);
  }
  ctx.globalAlpha = flick;
  atRocket(ctx, s, 1, g => {
    neon(ctx, g.flame, '#ff9d00', 4); neon(ctx, g.flameIn, '#ffe600', 3);
    neon(ctx, g.finL, '#19e3ff', 4); neon(ctx, g.finR, '#19e3ff', 4); neon(ctx, g.nozzle, '#19e3ff', 3);
    neon(ctx, g.body, '#ff3df2', 5); neon(ctx, g.noseLine, '#ff3df2', 3);
    neon(ctx, g.win1, '#19e3ff', 3); neon(ctx, g.win2, '#ffffff', 2);
  });
  ctx.globalAlpha = 1;
}

/* 3. Chalkboard: green slate, jittery semi-transparent chalk strokes that "boil" at 12 fps */
function sChalk(ctx, s) {
  ctx.fillStyle = '#26382f'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 9; i++) {
    const g = ctx.createRadialGradient(rnd(i, 20) * W, rnd(i, 21) * H, 0, rnd(i, 20) * W, rnd(i, 21) * H, 160);
    g.addColorStop(0, 'rgba(255,255,255,.07)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  ctx.drawImage(grain('chalk', '#fff', 5000, 0.08), 0, 0);
  const seed = s.fi; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(238,240,228,.55)'; ctx.lineWidth = 2.2;
  for (const c of s.clouds) jitterStroke(ctx, cloudOutline(c.x, c.y, c.sc), 2, 2.5, seed + c.i);
  ctx.strokeStyle = 'rgba(255,230,120,.8)'; ctx.lineWidth = 2;
  for (const st of s.stars) if (st.i % 4 === 0) { ctx.beginPath(); for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3 + 0.3; ctx.moveTo(st.x - Math.cos(a) * 6, st.y - Math.sin(a) * 6); ctx.lineTo(st.x + Math.cos(a) * 6, st.y + Math.sin(a) * 6); } ctx.stroke(); }
  ctx.strokeStyle = 'rgba(238,240,228,.5)'; ctx.lineWidth = 1.8;
  for (const q of s.puffs) { ctx.globalAlpha = q.a; scribble(ctx, q.x, q.y, q.r * 0.8, q.sd + seed * 7, 2); }
  ctx.globalAlpha = 1;
  atRocket(ctx, s, 1, g => {
    hatch(ctx, g.flame, 5, 0.5, 'rgba(255,170,90,.75)', 1.6);
    ctx.save(); ctx.clip(g.body); hatch(ctx, new Path2D('M-40,-100 H40 V-53 H-40 Z'), 5, -0.6, 'rgba(255,120,120,.7)', 1.6); ctx.restore();
    hatch(ctx, g.finL, 5, 0.6, 'rgba(255,120,120,.6)', 1.5); hatch(ctx, g.finR, 5, -0.6, 'rgba(255,120,120,.6)', 1.5);
    hatch(ctx, g.win2, 4, 0.8, 'rgba(140,200,255,.7)', 1.5);
    ctx.strokeStyle = 'rgba(245,245,235,.75)'; ctx.lineWidth = 2.2;
    g.all.forEach((p, i) => jitterStroke(ctx, p, 2, 2.2, seed * 3 + i));
    ctx.strokeStyle = 'rgba(255,190,110,.8)'; jitterStroke(ctx, g.flame, 2, 2, seed + 9);
  });
  ctx.fillStyle = '#7a4d26'; ctx.fillRect(0, 0, W, 14); ctx.fillRect(0, H - 22, W, 22); ctx.fillRect(0, 0, 14, H); ctx.fillRect(W - 14, 0, 14, H);
  ctx.fillStyle = '#f2efe6'; ctx.fillRect(W * 0.7, H - 30, 46, 9); ctx.fillStyle = '#f4b9b9'; ctx.fillRect(W * 0.7 + 56, H - 30, 30, 9);
}
function cloudOutline(x, y, sc) {
  const p = new Path2D();
  p.moveTo(x - 58 * sc, y + 20 * sc); p.lineTo(x + 58 * sc, y + 20 * sc);
  p.arc(x + 40 * sc, y + 2 * sc, 18 * sc, Math.PI / 2, -Math.PI / 2, true);
  p.arc(x + 10 * sc, y - 12 * sc, 28 * sc, 0.25, -Math.PI + 0.1, true);
  p.arc(x - 38 * sc, y + 2 * sc, 18 * sc, -Math.PI / 2, Math.PI / 2, true); p.closePath();
  return p;
}

/* 4. Comics: halftone sky, heavy black outlines, flat primaries, starburst, white panel border */
function burst(ctx, x, y, r1, r2, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n, r = i % 2 ? r2 : r1; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  ctx.closePath();
}
function sComics(ctx, s) {
  ctx.fillStyle = '#1f7fe0'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#58adff';
  for (let y = 0; y < H; y += 14) for (let x = (y / 14 % 2) * 7; x < W; x += 14) { const r = 1 + 3.2 * (y / H); circle(ctx, x, y, r); ctx.fill(); }
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (const l of s.lines) { ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x, l.y + l.len); ctx.stroke(); }
  for (const c of s.clouds) union(ctx, cloudPath(c.x, c.y, c.sc), '#fff', '#111', 4);
  const pulse = 1 + 0.08 * Math.sin(s.w * s.t * 24);
  const by = s.ry + 10;
  burst(ctx, s.rx, by, 150 * pulse, 95 * pulse, 14, s.t * 0.4); ctx.fillStyle = '#ffe11a'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = '#111'; ctx.stroke();
  burst(ctx, s.rx, by, 95 * pulse, 62 * pulse, 12, -s.t * 0.5); ctx.fillStyle = '#ff3b2f'; ctx.fill(); ctx.stroke();
  union(ctx, puffsPath(s), '#fff', '#111', 4);
  ctx.fillStyle = '#d6e6f5';
  for (const q of s.puffs) { circle(ctx, q.x + q.r * 0.3, q.y + q.r * 0.3, q.r * 0.45); ctx.fill(); }
  paintRocket(ctx, s, { flame: '#ff7b00', flameIn: '#ffe11a', fin: '#ff3b2f', nozzle: '#555', body: '#fff', shade: '#dfe7f0', nose: '#ff3b2f', band: '#ff3b2f', ring: '#111', win: '#3bc3ff', glint: '#fff', outline: '#111', lw: 4.5 });
  ctx.lineWidth = 26; ctx.strokeStyle = '#fff'; ctx.strokeRect(0, 0, W, H);
  ctx.lineWidth = 6; ctx.strokeStyle = '#111'; ctx.strokeRect(13, 13, W - 26, H - 26);
}

/* 5. PlayStation 1: faceted low-poly shapes, flat shading, vertex snapping/wobble, half-res */
function snap(v, s) { return Math.round(v / 3) * 3 + (rnd(Math.round(v * 7), s.fi) - 0.5) * 1.6; }

    for (let k = 0; k < 14; k++) { const y = Math.floor((head - k * 16) / 16) * 16; if (y < 0 || y > H) continue; ctx.fillStyle = k === 0 ? 'rgba(180,255,190,.9)' : `rgba(40,200,90,${0.35 * (1 - k / 14)})`; ctx.fillText(chars[Math.floor(rnd(c * 50 + Math.floor(y / 16), s.fi % 3) * chars.length)], c * 14, y); }
  }
  const dense = '@%#*+=-:. ';
  ctx.font = 'bold 15px "Liberation Mono","DejaVu Sans Mono",monospace';
  for (const q of s.puffs) { const n = Math.floor(q.r / 6); for (let k = 0; k < n; k++) { const a = rnd(q.sd * 13 + k, 102) * TAU, rr = Math.sqrt(rnd(q.sd * 13 + k, 103)) * q.r; ctx.fillStyle = `rgba(90,255,130,${0.7 * q.a})`; ctx.fillText(dense[Math.min(9, Math.floor(q.ph * 9 + rnd(k, s.fi) * 2))], q.x + Math.cos(a) * rr, q.y + Math.sin(a) * rr); } }
  ctx.font = 'bold 22px "Liberation Mono","DejaVu Sans Mono",monospace'; ctx.shadowColor = '#3f6'; ctx.shadowBlur = 12; ctx.fillStyle = '#7dff9b';
  const cw = 13.2, x0 = s.rx - (ASCII[0].length * cw) / 2, y0 = s.ry - 110;
  ASCII.forEach((row, i) => ctx.fillText(row, x0, y0 + i * 24));
  const fl = Math.round(2 + (s.flame - 0.8) * 4); ctx.fillStyle = '#ffd36b';
  for (let k = 0; k < fl; k++) ctx.fillText(['  )**(  ', '  (##)  ', '   **   ', '   ..   '][k % 4], x0 + cw, y0 + (ASCII.length + k) * 24);
  ctx.shadowBlur = 0;
  ctx.font = '16px "Liberation Mono","DejaVu Sans Mono",monospace'; ctx.fillStyle = '#7dff9b';
  const cmd = '$ ./launch --style=terminal', shown = cmd.slice(0, Math.min(cmd.length, Math.floor(s.t / LOOP * 60)));
  ctx.fillText(shown + (Math.floor(s.t * 2) % 2 ? '█' : ' '), 22, H - 44);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.6)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = 'alphabetic';
}

const STYLES = [
  ['pixel', 'פיקסל ארט', 'Pixel art', sPixel],
  ['neon', 'ניאון', 'Neon', sNeon],
  ['chalkboard', 'גיר על לוח', 'Chalkboard', sChalk],
  ['comics', 'קומיקס', 'Comics', sComics],
  ['ps1', 'פלייסטיישן 1', 'PS1 low-poly', sPS1],
  ['watercolor', 'צבעי מים', 'Watercolor', sWatercolor],
  ['blueprint', 'שרטוט', 'Blueprint', sBlueprint],
  ['voxel', 'קוביות', 'Voxel cubes', sVoxel],
  ['synthwave', 'שנות השמונים', '80s synthwave', sSynth],
  ['glossy3d', 'תלת ממד מבריק', 'Glossy 3D', sGlossy],
  ['pencil', 'עיפרון', 'Pencil sketch', sPencil],
  ['gameboy', 'גיים בוי', 'Game Boy', sGameBoy],
  ['flat', 'וקטור שטוח', 'Flat vector', sFlat],
  ['hologram', 'הולוגרמה', 'Hologram', sHolo],
  ['clay', 'פלסטלינה', 'Plasticine / clay', sClay],
  ['manga', 'מנגה', 'Manga', sManga],
  ['oneline', 'קו אחד', 'Single line', sOneLine],
  ['stainedglass', 'ויטראז׳', 'Stained glass', sStained],
  ['isometric', 'איזומטרי', 'Isometric', sIso],
  ['terminal', 'טרמינל', 'Terminal / ASCII', sTerminal],
].map(([id, he, en, draw], i) => ({ n: i + 1, id, he, en, draw }));

/* draw one style into a canvas of any pixel size (logical space is always W x H) */
function drawStyle(canvas, st, t) {
  const ctx = canvas.getContext('2d');
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0; ctx.setLineDash([]);
  ctx.save(); st.draw(ctx, scene(t)); ctx.restore();
}

/* the showcase reel: title, card with the current style, numbered list with the current one highlighted */
const REEL_STEP = 1.2, REEL_LEN = REEL_STEP * 20;
function drawReel(canvas, t) {
  const ctx = canvas.getContext('2d'), k = canvas.width / W;
  ctx.setTransform(k, 0, 0, k, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.shadowBlur = 0;
  t = ((t % REEL_LEN) + REEL_LEN) % REEL_LEN;
  const cur = Math.floor(t / REEL_STEP);
  const bg = ctx.createLinearGradient(0, 0, W, H); bg.addColorStop(0, '#3a0d06'); bg.addColorStop(0.5, '#7a2a0c'); bg.addColorStop(1, '#2a0804'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 4; i++) { const x = W * (0.2 + 0.6 * rnd(i, 120)) + Math.sin(t * 0.4 + i) * 60, y = H * rnd(i, 121) + Math.cos(t * 0.3 + i) * 80, g = ctx.createRadialGradient(x, y, 0, x, y, 260); g.addColorStop(0, 'rgba(255,140,40,.35)'); g.addColorStop(1, 'rgba(255,140,40,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = '900 34px "DejaVu Sans","FreeSans",sans-serif';
  ctx.fillText('20 סגנונות אנימציה', W / 2, 88); ctx.fillText('ש-Claude יודע לעשות', W / 2, 130);
  const cx = 22, cy = 180, cw = 300, ch = 533;
  const card = document.createElement('canvas'); card.width = Math.round(cw * k); card.height = Math.round(ch * k);
  drawStyle(card, STYLES[cur], t);
  ctx.save(); ctx.beginPath(); ctx.roundRect(cx, cy, cw, ch, 18); ctx.clip(); ctx.drawImage(card, cx, cy, cw, ch); ctx.restore();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.roundRect(cx, cy, cw, ch, 18); ctx.stroke();
  ctx.textAlign = 'right'; ctx.font = 'bold 16px "DejaVu Sans","FreeSans",sans-serif';
  STYLES.forEach((st, i) => {
    const y = 206 + i * 26.6, x = W - 18, label = `${st.n}. ${st.he}`;
    if (i === cur) { const w = ctx.measureText(label).width + 16; ctx.fillStyle = '#ffc83d'; ctx.beginPath(); ctx.roundRect(x - w + 8, y - 17, w, 23, 8); ctx.fill(); ctx.fillStyle = '#2a0804'; }
    else ctx.fillStyle = i < cur ? '#fff' : 'rgba(255,255,255,.55)';
    ctx.fillText(label, x, y);
  });
}

/* ---------- page modes ---------- */
const q = new URLSearchParams(location.search);
const RENDER = q.has('render');
const pick = v => STYLES.find(st => st.id === v || String(st.n) === v);
let main = null, mode = 'gallery', chosen = null;
if (q.has('reel')) mode = 'reel';
else if (q.get('style')) { chosen = pick(q.get('style')); mode = chosen ? 'single' : 'gallery'; }

if (mode === 'gallery' && !RENDER) {
  document.body.insertAdjacentHTML('beforeend', '<header><h1>20 סגנונות אנימציה</h1><p>אותה תנועה, 20 סגנונות. לחיצה פותחת מסך מלא. <a href="?reel=1">ריל התצוגה</a></p></header><main class="grid"></main>');
  const grid = document.querySelector('.grid'), cards = [];
  STYLES.forEach(st => {
    const f = document.createElement('figure');
    f.innerHTML = `<a href="?style=${st.n}"><canvas width="270" height="480"></canvas><figcaption>${st.n}. ${st.he}<small>${st.en}</small></figcaption></a>`;
    grid.appendChild(f); cards.push([f.querySelector('canvas'), st]);
  });
  const vis = new Set(), io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? vis.add(e.target) : vis.delete(e.target)));
  cards.forEach(([c]) => io.observe(c));
  let last = 0;
  const loop = now => { requestAnimationFrame(loop); if (now - last < 33) return; last = now; const t = now / 1000; for (const [c, st] of cards) if (vis.has(c)) drawStyle(c, st, t); };
  requestAnimationFrame(loop);
} else {
  document.body.classList.add(RENDER ? 'render' : 'single');
  const pw = parseInt(q.get('w') || (RENDER ? 1080 : 1080), 10);
  main = document.createElement('canvas'); main.width = pw; main.height = Math.round(pw * 16 / 9);
  document.body.appendChild(main);
  if (RENDER) { main.style.width = main.width + 'px'; main.style.height = main.height + 'px'; }
  const frame = t => mode === 'reel' ? drawReel(main, t) : drawStyle(main, chosen, t);
  window.renderAt = t => { frame(t); return true; };
  window.loopSeconds = mode === 'reel' ? REEL_LEN : LOOP;
  if (!RENDER) { const t0 = performance.now(); const loop = now => { frame((now - t0) / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  else frame(0);
}
window.STYLES = STYLES.map(({ n, id, he, en }) => ({ n, id, he, en }));
window.ready = true;
</script>
